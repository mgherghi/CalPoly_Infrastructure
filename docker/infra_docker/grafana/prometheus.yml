global:
  scrape_interval: 60s # How often to fetch metrics
scrape_configs:
  - job_name: 'drbd_metrics'
    static_configs:
      - targets:
          - 'r730xd-1.local:9942'
          - 'r730xd-2.local:9942'
          - 'r730xd-3.local:9942'
          - 'supermicro.local:9942'
          - 'gigabyte.local:9942'
          - 'r620.local:9942'

  - job_name: 'linstor_metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'r730xd-1.local:3370'

  - job_name: 'haproxy_metrics'
    scheme: http
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - '2.0.0.100:8405'

  - job_name: 'incus_metrics'
    scheme: https
    metrics_path: '/1.0/metrics'
    static_configs:
      - targets:
          - 'gigabyte.local:8444'
          - 'r620.local:8444'
          - 'supermicro.local:8444'
    tls_config:
      insecure_skip_verify: true


  - job_name: 'node_metrics'
    scheme: http
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'r730xd-1.local:9100'
          - 'r730xd-2.local:9100'
          - 'r730xd-3.local:9100'
          - 'supermicro.local:9100'
          - 'gigabyte.local:9100'
          - 'r620.local:9100'

  - job_name: 'ovs_metrics'
    scheme: http
    static_configs:
      - targets:
          - '4.2.0.11:6103'
