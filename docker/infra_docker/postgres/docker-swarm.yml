services:
  # Primary PostgreSQL server
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"  # PostgreSQL default port
    environment:
      - POSTGRES_USER=admin          # Default user
      - POSTGRES_PASSWORD=M23d03b89   # Password for the user
      - POSTGRES_DB=postgres                # Default database
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure


volumes:
  postgres-data:
    name: postgres-data
    driver: linbit/linstor-docker-volume
    driver_opts:
      size: 10GB
      storagePool: "swarm-pool"

